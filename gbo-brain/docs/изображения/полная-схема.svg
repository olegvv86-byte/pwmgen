<text class="n" x="250" y="1109">ЭТО ДОБАВЛЕНО</text>

<text class="w" x="40" y="1134">R12…R14 и C7…C9 поставить ВПЛОТНУЮ К ПРОЦЕССОРУ, конденсатор — прямо на ножку. Старые 100 нФ у делителей СНЯТЬ: они слишком медленные, плата теперь меряет с погашенным ШИМ, и за 2,5 мс они не успевают.</text>

