<text class="s" x="52" y="1254">X2</text>
<text class="s" x="22" y="1302">+12 В от АКБ</text>
<text class="s" x="108" y="1254">F2  30 А</text>
<text class="s" x="206" y="1244">K1  40 А</text>
<text class="s" x="106" y="1344">K1 катушка 12 В</text>
<text class="s" x="320" y="1390">D3 1N4007</text>
<text class="s" x="258" y="1332">+12 В зажигания</text>
<text class="s" x="136" y="1442">к коллектору Q1</text>
<text class="s" x="104" y="1478">вынесено, у аккумулятора</text>

<text class="s" x="538" y="1384">EK1</text>
<text class="s" x="588" y="1384">EK2</text>
<text class="s" x="638" y="1384">EK3</text>
<text class="s" x="688" y="1384">EK4</text>
<text class="s" x="524" y="1448">латунный блок 35 × 45</text>
<text class="s" x="524" y="1466">4 × 2,4 Ом → 0,6 Ом,  20 А,  240 Вт</text>
<text class="s" x="524" y="1484">по два элемента в пластине</text>

<text class="s" x="778" y="1404">провод 4 мм²</text>
<text class="s" x="796" y="1322">ПЛАТА</text>
<text class="s" x="794" y="1498">от TC4420</text>
<text class="s" x="834" y="1452">R8 47 Ом</text>
<text class="s" x="828" y="1516">R9 10 к</text>
<text class="s" x="968" y="1446">сток</text>
<text class="s" x="968" y="1506">исток</text>
<text class="s" x="796" y="1560">Q2  IRLB3034PBF  ·  1,4 Вт  ·  радиатор TO-220</text>

<text class="s" x="1108" y="1446">D7</text>
<text class="s" x="1108" y="1462">SMBJ18A</text>
<text class="s" x="1108" y="1486">катод</text>
<text class="s" x="1108" y="1502">к стоку</text>
<rect class="nbox" x="1094" y="1392" width="104" height="18" rx="4"/>
<text class="n" x="1104" y="1405">ЭТО ДОБАВЛЕНО</text>

<text class="s" x="240" y="1592">исток Q2 и масса платы — в одну точку на клемме, дальше один провод к минусу АКБ</text>
<text class="s" x="30" y="1584">−</text>
<text class="s" x="26" y="1644">звезда</text>

<text class="h2" x="40" y="1678">Примечания — в файле примечания.txt рядом со схемой</text>
<rect class="wbox" x="40" y="1706" width="1160" height="238" rx="6"/>
<text class="wh" x="62" y="1738">МОНТАЖ ПРОВОДКИ ДАТЧИКОВ — ЭТО ВАЖНЕЕ ЛЮБОГО КОНДЕНСАТОРА</text>

<text class="w" x="62" y="1766">Провода датчиков НЕЛЬЗЯ мотать в один жгут с силовыми. Двадцать ампер, рвущиеся килогерцем, наводят в соседний провод помеху, и плата</text>
<text class="w" x="62" y="1784">меряет не температуру, а помеху. Именно так и выглядит сбой: один канал уезжает вниз, второй начинает прыгать.</text>

<text class="s" x="62" y="1818">1.  Расплести жгут. Датчики вести отдельной трассой, подальше от силовых. Если пересекаются — только под прямым углом, не вдоль.</text>
<text class="s" x="62" y="1840">2.  На каждый датчик витая пара: сигнал и его собственный обратный провод. Обратные вести на массу платы, а не на кузов у нагревателей.</text>
<text class="s" x="62" y="1862">3.  Экран, если есть, сажать на массу ТОЛЬКО со стороны платы. С двух сторон — получится виток, будет хуже, чем без экрана.</text>
<text class="s" x="62" y="1884">4.  Проверить изоляцию: на холодную, при снятом питании, сопротивление от каждого провода датчика до металла пластины и до клемм</text>
<text class="s" x="80" y="1902">нагревателей должно быть в мегомах. Килоомы — пробой, и через него в АЦП лезет 12 вольт с ШИМ. R12…R14 как раз от этого и страхуют.</text>
<text class="s" x="62" y="1924">5.  Масса делителей и исток Q2 — в одну точку на клемме, а не на общей дорожке. См. примечание про звезду внизу силовой части.</text>

</svg>
