<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1160" viewBox="0 0 760 580">
<title>Силовая часть подогревателя ГБО — 12 В, вынесенное реле</title>
<style>
  .wire { stroke:#16181d; stroke-width:1.6; fill:none; stroke-linecap:round; }
  .dot  { fill:#16181d; }
  .box  { stroke:#9aa3b2; stroke-width:1.3; fill:none; stroke-dasharray:5 4; }
  .h    { font:600 15px system-ui,"Segoe UI",sans-serif; fill:#16181d; }
  .s    { font:12px system-ui,"Segoe UI",sans-serif; fill:#3d434e; }
  .n    { font:500 11px system-ui,"Segoe UI",sans-serif; fill:#0f766e; }
  .nbox { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; }
</style>
<rect width="760" height="580" fill="#ffffff"/>

<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,1 L7,4 L0,7 z" fill="#16181d"/>
  </marker>
</defs>

<rect class="box" x="72" y="92" width="150" height="58" rx="5"/>
<rect class="box" x="258" y="138" width="180" height="94" rx="5"/>
<rect class="box" x="494" y="196" width="206" height="234" rx="5"/>

<g class="wire">
  <circle cx="50" cy="121" r="5"/>
  <path d="M55 121 H88"/>
  <rect x="88" y="113" width="38" height="16" rx="2"/>
  <path d="M126 121 H160"/>
  <path d="M162 119 L204 104"/>
  <path d="M206 121 H590"/>

  <path d="M285 121 V166 M330 121 V166 M375 121 V166 M420 121 V166"/>
  <rect x="276" y="166" width="18" height="46" rx="2"/>
  <rect x="321" y="166" width="18" height="46" rx="2"/>
  <rect x="366" y="166" width="18" height="46" rx="2"/>
  <rect x="411" y="166" width="18" height="46" rx="2"/>
  <path d="M285 212 V266 M330 212 V266 M375 212 V266 M420 212 V266"/>
  <path d="M285 266 H590"/>

  <path d="M590 266 V304"/>
  <path d="M568 294 V350 M558 294 V350 M534 322 H558"/>
  <path d="M568 304 H590 M568 340 H590 M590 340 V396"/>
  <path d="M568 322 H586" marker-end="url(#a)"/>
  <path d="M508 322 H534" marker-end="url(#a)"/>

  <path d="M590 266 H660 V300"/>
  <path d="M648 322 H672 L660 300 z"/>
  <path d="M646 306 L646 300 L674 300 L674 294"/>
  <path d="M660 322 V396 H590"/>

  <path d="M590 396 V440 H60"/>
  <circle cx="50" cy="440" r="5"/>
  <path d="M55 440 H60"/>
  <path d="M46 452 H74 M52 459 H68 M57 465 H63"/>
</g>

<g class="dot">
  <circle cx="160" cy="121" r="2.5"/><circle cx="206" cy="121" r="2.5"/>
  <circle cx="330" cy="266" r="2.5"/><circle cx="375" cy="266" r="2.5"/>
  <circle cx="420" cy="266" r="2.5"/>
  <circle cx="330" cy="121" r="2.5"/><circle cx="375" cy="121" r="2.5"/>
  <circle cx="420" cy="121" r="2.5"/>
  <circle cx="590" cy="266" r="2.5"/><circle cx="590" cy="396" r="2.5"/>
</g>

<text class="h" x="40" y="55">Силовая цепь — 12 В, реле вынесено</text>
<text class="s" x="40" y="74">к плате идут только два силовых провода</text>

<text class="s" x="18" y="112">+12 В</text>
<text class="s" x="26" y="142">АКБ</text>
<text class="s" x="84" y="107">F2  30 А</text>
<text class="s" x="164" y="92">K1  40 А</text>
<text class="s" x="76" y="166">вынесено, у аккумулятора</text>

<text class="s" x="264" y="228">EK1</text>
<text class="s" x="309" y="228">EK2</text>
<text class="s" x="354" y="228">EK3</text>
<text class="s" x="399" y="228">EK4</text>
<text class="s" x="262" y="250">латунный блок</text>
<text class="s" x="262" y="294">4 × 2,4 Ом → 0,6 Ом</text>
<text class="s" x="262" y="310">20 А,  240 Вт</text>
<text class="s" x="262" y="326">по два элемента в пластине</text>

<text class="s" x="436" y="258">провод от нагревателей</text>
<text class="s" x="500" y="188">ПЛАТА</text>

<text class="s" x="500" y="300">затвор</text>
<text class="s" x="500" y="314">от TC4420</text>

<text class="s" x="500" y="370">Q2</text>
<text class="s" x="500" y="386">IRLB3034PBF</text>
<text class="s" x="500" y="402">20 А · 1,4 Вт</text>
<text class="s" x="500" y="418">радиатор TO-220</text>

<text class="s" x="598" y="318">сток</text>
<text class="s" x="598" y="356">исток</text>

<text class="s" x="686" y="296">D7</text>
<text class="s" x="686" y="312">SMBJ18A</text>
<text class="s" x="686" y="334">катод</text>
<text class="s" x="686" y="350">к стоку</text>

<rect class="nbox" x="624" y="232" width="104" height="18" rx="4"/>
<text class="n" x="634" y="245">ЭТО ДОБАВЛЕНО</text>

<text class="s" x="150" y="432">обратный силовой провод, отдельный от массы платы</text>
<text class="s" x="22" y="424">−</text>
<text class="s" x="20" y="484">звезда</text>

<text class="s" x="40" y="520">D7 — супрессор, а не обычный диод. Ниже 18 В это обрыв, нагрузку он не шунтирует и транзистор не обходит.</text>
<text class="s" x="40" y="538">Открывается только на выброс: гасит 200 мкДж за каждое выключение, на 1 кГц это 0,2 Вт — для него пустяк.</text>
<text class="s" x="40" y="556">Без него эти 0,2 Вт съедает сам транзистор лавиной, сверх своих рабочих 1,4 Вт. Паять прямо на выводы Q2.</text>
</svg>
