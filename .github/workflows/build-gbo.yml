name: Build GBO APK

on:
  push:
    branches: [ main ]
    paths:
      - 'gbo-brain/**'
      - '.github/workflows/build-gbo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x ./gbo-brain/gradlew

      - name: Build Debug APK
        working-directory: gbo-brain
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gbo-heater-debug
          path: gbo-brain/app/build/outputs/apk/debug/app-debug.apk
